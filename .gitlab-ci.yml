        - echo "Building DoLP Modloader v0.$CI_PIPELINE_IID"
        - find . -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - mkdir -p releases/DoLP_Modloader/img/
        - mkdir -p releases/DoLP_Modloader/mod/
        - sh ./compile.sh
        - node "dist-insertTools/insert2html.cjs" "Degrees of Lewdity.html" "modList.json" "dist-BeforeSC2/BeforeSC2.js"
        - cp "Degrees of Lewdity.html.mod.html" ./releases/DoLP_Modloader/
        - cp "modList.json" ./releases/DoLP_Modloader/
        - cp -r -f ./mod/* ./releases/DoLP_Modloader/mod/ 
        - cp -r -f ./vanillaimg/* ./releases/DoLP_Modloader/img/
        - echo "Finished Building DoLP Modloader v0.$CI_PIPELINE_IID"
