        - master

release_job:
    stage: upload
    image: registry.gitlab.com/gitlab-org/release-cli:latest
    needs:
        - job: build_upload_vanilla_job
        - job: build_upload_beeesss_job
        - job: build_upload_beeesss_hikari_female_job
        - job: build_upload_beeesss_hikari_male_job
        - job: build_upload_beeesss_paril_hairext_job
        - job: build_upload_beeesss_wax_job
        - job: build_upload_beeesss_okbd_job
        - job: build_upload_lllysmasc_job
        - job: build_upload_susato_job
        - job: build_upload_mizz_job
        - job: build_upload_MVCR_job
        - job: build_upload_modloader_job
          artifacts: true
    rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    script:
        - echo "Creating releases..."
    release:
        description: 'Click on one of the links under OTHER with the image pack you want to use, extract the downloaded zip and play.
            
            Changelogs:'
        tag_name: 'v0.$CI_PIPELINE_IID'
        ref: '$CI_COMMIT_SHA'
        assets:
            links:
                - name: 'DoLP_Vanilla'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_Vanilla_v0.$CI_PIPELINE_IID.zip"
                - name: 'DoLP_BEEESSS'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS_v0.$CI_PIPELINE_IID.zip"
                - name: 'DoLP_BEEESSS+Hikari_Female'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS+Hikari_Female_v0.$CI_PIPELINE_IID.zip"
                - name: 'DoLP_BEEESSS+Hikari_Male'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS+Hikari_Male_v0.$CI_PIPELINE_IID.zip"
                - name: 'DoLP_BEEESSS+Paril+Hairstyle_Extended'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS+Paril+Hairstyle_Extended_v0.$CI_PIPELINE_IID.zip"
                - name: 'DoLP_BEEESSS_Wax'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS_Wax_v0.$CI_PIPELINE_IID.zip"
                - name: 'DoLP_BEEESSS_Okbd'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS_Okbd_v0.$CI_PIPELINE_IID.zip"
                - name: 'DoLP_lllysmasc'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_lllysmasc_v0.$CI_PIPELINE_IID.zip"
                - name: 'DoLP_susato'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_susato_v0.$CI_PIPELINE_IID.zip"
                - name: 'DoLP_MIZZ'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_MIZZ_v0.$CI_PIPELINE_IID.zip"
                - name: 'DoLP_MVCR'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_MVCR_v0.$CI_PIPELINE_IID.zip"
                - name: 'DoLP_Modloader'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_Modloader_v0.$CI_PIPELINE_IID.zip"
    after_script:
        - echo "Finished creating releases."
