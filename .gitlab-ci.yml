stages:
    - build
    - release

variables:
    VERSION: ""

before_script:
    - export VERSION=$(cat version)
    - SANITIZED_VERSION=$(echo "$VERSION" | tr ' ' _)
    - apk add --no-cache zip
    - apk add --no-cache curl
    - mkdir -p releases/DoLP_Vanilla/img/
    - mkdir -p releases/DoLP_BEEESSS/img/
    - mkdir -p releases/DoLP_BEEESSS+Hikari_Female/img/
    - mkdir -p releases/DoLP_BEEESSS+Hikari_Male/img/
    - mkdir -p releases/DoLP_BEEESSS+Paril+Hairstyle_Extended/img/

build_job:
    stage: build
    script:
    - echo "Building version $VERSION"
    - sh ./compile.sh
    - cp "Degrees of Lewdity.html" ./releases/DoLP_Vanilla/
    - cp -r -f ./vanillaimg/* ./releases/DoLP_Vanilla/img/
    - zip -r ./releases/DoLP_Vanilla/DoLP_Vanilla.zip ./releases/DoLP_Vanilla/
    - 'curl 
        --header "JOB-TOKEN: $CI_JOB_TOKEN"
        --upload-file ./releases/DoLP_Vanilla/DoLP_Vanilla.zip
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_Vanilla.zip"'
    - cp "Degrees of Lewdity.html" ./releases/DoLP_BEEESSS/
    - cp -r -f ./beeesssimg/* ./releases/DoLP_BEEESSS/img/
    - zip -r ./releases/DoLP_BEEESSS/DoLP_BEEESSS.zip ./releases/DoLP_BEEESSS/
    - 'curl 
        --header "JOB-TOKEN: $CI_JOB_TOKEN"
        --upload-file ./releases/DoLP_BEEESSS/DoLP_BEEESSS.zip
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS.zip"'
    - cp "Degrees of Lewdity.html" ./releases/DoLP_BEEESSS+Hikari_Female/
    - cp -r -f ./beeessshikarifemaleimg/* ./releases/DoLP_BEEESSS+Hikari_Female/img/
    - zip -r ./releases/DoLP_BEEESSS+Hikari_Female/DoLP_BEEESSS+Hikari_Female.zip ./releases/DoLP_BEEESSS+Hikari_Female/
    - 'curl 
        --header "JOB-TOKEN: $CI_JOB_TOKEN"
        --upload-file ./releases/DoLP_BEEESSS+Hikari_Female/DoLP_BEEESSS+Hikari_Female.zip
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS+Hikari_Female.zip"'
    - cp "Degrees of Lewdity.html" ./releases/DoLP_BEEESSS+Hikari_Male/
    - cp -r -f ./beeessshikarimaleimg/* ./releases/DoLP_BEEESSS+Hikari_Male/img/
    - zip -r ./releases/DoLP_BEEESSS+Hikari_Male/DoLP_BEEESSS+Hikari_Male.zip ./releases/DoLP_BEEESSS+Hikari_Male/
    - 'curl 
        --header "JOB-TOKEN: $CI_JOB_TOKEN"
        --upload-file ./releases/DoLP_BEEESSS+Hikari_Male/DoLP_BEEESSS+Hikari_Male.zip
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS+Hikari_Male.zip"'
    - cp "Degrees of Lewdity.html" ./releases/DoLP_BEEESSS+Paril+Hairstyle_Extended/
    - cp -r -f ./beeesssparilhairstyleextendedimg/* ./releases/DoLP_BEEESSS+Paril+Hairstyle_Extended/img/
    - zip -r ./releases/DoLP_BEEESSS+Paril+Hairstyle_Extended/DoLP_BEEESSS+Paril+Hairstyle_Extended.zip ./releases/DoLP_BEEESSS+Paril+Hairstyle_Extended/
    - 'curl 
        --header "JOB-TOKEN: $CI_JOB_TOKEN"
        --upload-file ./releases/DoLP_BEEESSS+Paril+Hairstyle_Extended/DoLP_BEEESSS+Paril+Hairstyle_Extended.zip
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS+Paril+Hairstyle_Extended.zip"'
    only:
    - master

after_script:
    - echo "Finished building."

release_job:
    stage: release
    image: registry.gitlab.com/gitlab-org/release-cli:latest
    needs:
        - job: build_job
          artifacts: true
    rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    script:
        - echo "Creating releases..."
    release:
        description: release_notes.md
        tag_name: 'v0.$CI_PIPELINE_IID'
        ref: '$CI_COMMIT_SHA'
        assets:
            links:
                - name: 'DoLP_Vanilla'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_Vanilla.zip"
                - name: 'DoLP_BEEESSS'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS.zip"
                - name: 'DoLP_BEEESSS+Hikari_Female'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS+Hikari_Female.zip"
                - name: 'DoLP_BEEESSS+Hikari_Male'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS+Hikari_Male.zip"
                - name: 'DoLP_BEEESSS+Paril+Hairstyle_Extended'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS+Paril+Hairstyle_Extended.zip"