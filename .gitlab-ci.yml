stages:
    - compilation
    - upload

variables:
    GIT_STRATEGY: fetch
    # Required GitLab CI/CD variables for R2 uploads:
    # R2_ACCOUNT_ID, R2_BUCKET, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
    # Required for release links: R2_PUBLIC_URL, without a trailing slash.

default:
    retry: 2

before_script:
    - apk add --no-cache zip jq nodejs git aws-cli
    - |
        upload_r2_zip() {
            package_name="$1"
            shift
            version="v0.$CI_PIPELINE_IID"
            zip_name="${package_name}_${version}.zip"
            object_key="${package_name}/${version}/${zip_name}"
            endpoint_url="${R2_ENDPOINT_URL:-https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com}"

            : "${R2_ACCOUNT_ID:?Set R2_ACCOUNT_ID in GitLab CI/CD variables}"
            : "${R2_BUCKET:?Set R2_BUCKET in GitLab CI/CD variables}"
            : "${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in GitLab CI/CD variables}"
            : "${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in GitLab CI/CD variables}"

            rm -f "./${zip_name}"
            zip -r "./${zip_name}" "$@" >/dev/null

            aws s3 cp "./${zip_name}" "s3://${R2_BUCKET}/${object_key}" \
                --endpoint-url "$endpoint_url" \
                --region auto \
                --content-type "application/zip" \
                --cache-control "public, max-age=31536000, immutable" \
                --no-progress
        }

dolmods_update:
    stage: compilation
    script:
        - find ./version -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - find ./devTools/apkbuilder/config.xml -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - find ./game/01-config/sugarcubeConfig.js -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - version=$(cat version)
        - git config --global user.email $username
        - git config --global user.name $username
        - git add .
        - git commit -m "Update Dolmods $version"
        - git push "https://$username:$token@gitgud.io/Frostberg/degrees-of-lewdity-plus.git" HEAD:dolmods --force
    only:
        - master

build_upload_job:
    stage: compilation
    script:
        - echo "Building DoLP v0.$CI_PIPELINE_IID"
        - find ./version -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - find ./devTools/apkbuilder/config.xml -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - find ./game/01-config/sugarcubeConfig.js -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - version=$(cat version)
        - sh ./compile.sh
        - echo "Finished Building DoLP v0.$CI_PIPELINE_IID"
        - echo "Uploading DoLP v0.$CI_PIPELINE_IID"
        - upload_r2_zip "DoLP" "Degrees of Lewdity.html" "./img"
        - rm -f ./DoLP_v0.$CI_PIPELINE_IID.zip
        - echo "Finished Uploading DoLP v0.$CI_PIPELINE_IID"
    only:
        - master

build_upload_html_only_job:
    stage: compilation
    script:
        - echo "Building DoLP HTML only v0.$CI_PIPELINE_IID"
        - find ./version -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - find ./devTools/apkbuilder/config.xml -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - find ./game/01-config/sugarcubeConfig.js -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - version=$(cat version)
        - sh ./compile.sh
        - echo "Finished Building HTML only v0.$CI_PIPELINE_IID"
        - echo "Uploading DoLP HTML only v0.$CI_PIPELINE_IID"
        - upload_r2_zip "DoLP_HTML_only" "Degrees of Lewdity.html"
        - rm -f ./DoLP_HTML_only_v0.$CI_PIPELINE_IID.zip
        - echo "Finished Uploading DoLP HTML only v0.$CI_PIPELINE_IID"
    only:
        - master

release_job:
    stage: upload
    image: registry.gitlab.com/gitlab-org/release-cli:latest
    before_script: []
    needs:
        - job: build_upload_job
        - job: build_upload_html_only_job
    rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    script:
        - test -n "$R2_PUBLIC_URL" || { echo "Set R2_PUBLIC_URL in GitLab CI/CD variables, without a trailing slash"; exit 1; }
        - echo "Creating releases..."
    release:
        description: 'Click on one of the links under OTHER with the image pack you want to use, extract the downloaded zip and play.
            Changelogs:'
        tag_name: 'v0.$CI_PIPELINE_IID'
        ref: '$CI_COMMIT_SHA'
        assets:
            links:
                - name: 'DoLP'
                  url: "${R2_PUBLIC_URL}/DoLP/v0.$CI_PIPELINE_IID/DoLP_v0.$CI_PIPELINE_IID.zip"
                - name: 'DoLP_HTML_only'
                  url: "${R2_PUBLIC_URL}/DoLP_HTML_only/v0.$CI_PIPELINE_IID/DoLP_HTML_only_v0.$CI_PIPELINE_IID.zip"
    after_script:
        - echo "Finished creating releases."