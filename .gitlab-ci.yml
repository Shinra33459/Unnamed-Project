stages:
    - compilation
    - upload

variables:
    VERSION: ""

before_script:
    - apk add --no-cache zip curl jq nodejs git
    - echo "Fetching latest changes from master"
    - git fetch origin master
    - git reset --hard origin/master

dolmods_update:
    stage: compilation
    script:
        - git config --global user.email $username
        - git config --global user.name $token
        - find . -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - git add .
        - git commit -m "Update Dolmods"
        - git push "https://$username:$token@gitgud.io/Andrest07/degrees-of-lewdity-plus.git" HEAD:dolmods --force
    only:
        - master

build_upload_vanilla_job:
    stage: compilation
    script:
        - echo "Building DoLP Vanilla v0.$CI_PIPELINE_IID"
        - find . -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - mkdir -p releases/DoLP_Vanilla/img/
        - sh ./compile.sh
        - cp "Degrees of Lewdity.html" ./releases/DoLP_Vanilla/
        - cp -r -f ./vanillaimg/* ./releases/DoLP_Vanilla/img/
        - echo "Finished Building DoLP Vanilla v0.$CI_PIPELINE_IID"
        - echo "Uploading DoLP Vanilla v0.$CI_PIPELINE_IID"
        - zip -r ./releases/DoLP_Vanilla/DoLP_Vanilla_v0.$CI_PIPELINE_IID.zip ./releases/DoLP_Vanilla/ 1>NUL
        - 'curl 
            --header "JOB-TOKEN: $CI_JOB_TOKEN"
            --upload-file ./releases/DoLP_Vanilla/DoLP_Vanilla_v0.$CI_PIPELINE_IID.zip
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_Vanilla_v0.$CI_PIPELINE_IID.zip"'
        - echo "Finished Uploading DoLP Vanilla v0.$CI_PIPELINE_IID"
    only:
        - master
        
