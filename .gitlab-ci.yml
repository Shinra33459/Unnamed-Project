release_job:
    stage: auto-release
    image: registry.gitlab.com/gitlab-org/release-cli:latest
    needs:
        - job: build_upload_vanilla_job
        - job: build_upload_beeesss_job
        - job: build_upload_beeesss_hikari_female_job
        - job: build_upload_beeesss_hikari_male_job
        - job: build_upload_beeesss_paril_hairext_job
        - job: build_upload_modloader_job
          artifacts: true
    rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    script:
        - echo "Creating releases..."
    release:
        description: 'null'
        tag_name: 'v0.$CI_PIPELINE_IID'
        ref: '$CI_COMMIT_SHA'
        assets:
            links:
                - name: 'DoLP_Vanilla'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_Vanilla_v0.$CI_PIPELINE_IID.zip"
