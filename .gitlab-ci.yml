release_job:
    stage: upload
    image: registry.gitlab.com/gitlab-org/release-cli:latest
    before_script: []
    needs:
        - job: build_upload_vanilla_job
        - job: build_upload_beeesss_job
        - job: build_upload_beeesss_mysterious_job
        - job: build_upload_beeesss_hikari_female_job
        - job: build_upload_hikfem_mysterious_job
        - job: build_upload_goose_female_job
        - job: build_upload_goose_female_mysterious_job
        - job: build_upload_goose_masc_job
        - job: build_upload_goose_masc_mys_job
        - job: build_upload_mikili_job
        - job: build_upload_mikili_mys_job
        - job: build_upload_au_job
        - job: build_upload_au_mys_job
        - job: build_upload_aumasc_job
        - job: build_upload_aumasc__mysjob
        - job: build_upload_rotting_job
        - job: build_upload_rotting_mys_job
        # - job: build_upload_modloader_job
        - job: build_upload_html_only_job
    rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    script:
        - test -n "$R2_PUBLIC_URL" || { echo "Set R2_PUBLIC_URL in GitLab CI/CD variables, without a trailing slash"; exit 1; }
        - echo "Creating releases..."
    release:
        description: 'Click on one of the links under OTHER with the image pack you want to use, extract the downloaded zip and play.
            Changelogs:'
        tag_name: 'v0.$CI_PIPELINE_IID'
        ref: '$CI_COMMIT_SHA'
        assets:
            links:
                - name: 'DoLP_Vanilla'
                  url: "${R2_PUBLIC_URL}/DoLP_Vanilla/v0.$CI_PIPELINE_IID/DoLP_Vanilla_v0.$CI_PIPELINE_IID.zip"
                - name: 'DoLP_BEEESSS'
