stages:
    - build
    - release

variables:
    VERSION: ""

before_script:
    - export VERSION=$(cat version)
    - SANITIZED_VERSION=$(echo "$VERSION" | tr ' ' _)
    - mkdir -p releases/DoLP_Vanilla/img/
    - mkdir -p releases/DoLP_BEEESSS/img/
    - mkdir -p releases/DoLP_BEEESSS+Hikari_Female/img/
    - mkdir -p releases/DoLP_BEEESSS+Hikari_Male/img/
    - mkdir -p releases/DoLP_BEEESSS+Paril+Hairstyle_Extended/img/

build_job:
    stage: build
    script:
    - echo "Building version $VERSION"
    - sh ./compile.sh
    - cp "Degrees of Lewdity.html" ./releases/DoLP_Vanilla/
    - cp -r -f ./vanillaimg/* ./releases/DoLP_Vanilla/img/
    - cp "Degrees of Lewdity.html" ./releases/DoLP_BEEESSS/
    - cp -r -f ./beeesssimg/* ./releases/DoLP_BEEESSS/img/
    - cp "Degrees of Lewdity.html" ./releases/DoLP_BEEESSS+Hikari_Female/
    - cp -r -f ./beeessshikarifemaleimg/* ./releases/DoLP_BEEESSS+Hikari_Female/img/
    - cp "Degrees of Lewdity.html" ./releases/DoLP_BEEESSS+Hikari_Male/
    - cp -r -f ./beeessshikarimaleimg/* ./releases/DoLP_BEEESSS+Hikari_Male/img/
    - cp "Degrees of Lewdity.html" ./releases/DoLP_BEEESSS+Paril+Hairstyle_Extended/
    - cp -r -f ./beeesssparilhairstyleextendedimg/* ./releases/DoLP_BEEESSS+Paril+Hairstyle_Extended/img/
    - apk add curl jq
    - 'curl -H "PRIVATE-TOKEN: $CI_API_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/changelog?version=$SANITIZED_VERSION" | jq -r .notes > release_notes.md'
    artifacts:
        paths:
            - releases/
            - release_notes.md
    only:
    - master

after_script:
    - echo "Finished building."

release_job:
    stage: release
    image: registry.gitlab.com/gitlab-org/release-cli:latest
    needs:
        - job: build_job
          artifacts: true
    rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    script:
        - echo "Creating releases..."
    release:
        name: 'Release $SANITIZED_VERSION'
        description: release_notes.md
        tag_name: '$SANITIZED_VERSION'
        ref: '$CI_COMMIT_SHA'
        assets:
            links:
                - name: '$SANITIZED_VERSION'
                  url: "https://$CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:$CI_COMMIT_SHA"