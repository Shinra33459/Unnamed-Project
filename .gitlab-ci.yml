stages:
    - init
    - compilation
    - upload

variables:
    VERSION: ""
    GIT_STRATEGY: none

before_script:
    - apk add --no-cache zip curl jq nodejs git
#     - |
#         if [ -d ".git" ]; then
#             echo "Repository already cloned, resetting..."
#             git fetch origin master
#             git reset --hard origin/master
#         else
#             echo "Repository not cloned, cloning now..."
#             git config --global user.email $username
#             git config --global user.name $token
#             git clone "https://$username:$token@gitgud.io/Frostberg/degrees-of-lewdity-plus.git" .
#         fi

init:
    stage: init
    script:
        - |
            if [ -d "./repo/.git" ]; then
                echo "Repository already cloned, resetting..."
                cd ./repo/
                git fetch origin master
                git reset --hard origin/master
            else
                echo "Repository not cloned, cloning now..."
                git config --global user.email $username
                git config --global user.name $token
                git clone "https://$username:$token@gitgud.io/Frostberg/degrees-of-lewdity-plus.git" repo
            fi
    cache:
        key: "${CI_PROJECT_NAME}-repo"
        paths:
            - repo/
    only:
        - master

dolmods_update:
    stage: compilation
    dependencies:
        - init
    script:
        - cd ./repo/
        - git fetch origin master
        - git reset --hard origin/master
        - find ./version -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - find ./devTools/androidsdk/image/cordova/config.xml -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - find ./devTools/apkbuilder/config.xml -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - find ./devTools/apkbuilder/platforms/android/app/src/main/AndroidManifest.xml -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - find ./devTools/apkbuilder/platforms/android/app/src/main/assets/www/index.html -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - find ./devTools/apkbuilder/platforms/android/app/src/main/res/xml/config.xml -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - find ./game/01-config/sugarcubeConfig.js -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - version=$(cat version)
        - git config --global user.email $username
        - git config --global user.name $token
        - git add .
        - git commit -m "Update Dolmods $version"
        - git push "https://$username:$token@gitgud.io/Frostberg/degrees-of-lewdity-plus.git" HEAD:dolmods --force
    cache:
        key: "${CI_PROJECT_NAME}-repo"
        paths:
            - repo/
    only:
        - master

