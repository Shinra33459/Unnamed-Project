stages:
    - compilation
    - upload

variables:
    GIT_STRATEGY: fetch

before_script:
    - apk add --no-cache zip curl jq nodejs git
    - rm -rf .git/index
    - git reset --hard

dolmods_update:
    stage: compilation
    script:
        - find ./version -type f -exec sed -i "s/DoTP version/DoTP v0.$CI_PIPELINE_IID/g" {} +
        - find ./devTools/androidsdk/image/cordova/config.xml -type f -exec sed -i "s/DoTP version/DoTP v0.$CI_PIPELINE_IID/g" {} +
        - find ./devTools/apkbuilder/config.xml -type f -exec sed -i "s/DoTP version/DoTP v0.$CI_PIPELINE_IID/g" {} +
        - find ./game/01-config/sugarcubeConfig.js -type f -exec sed -i "s/DoTP version/DoTP v0.$CI_PIPELINE_IID/g" {} +
        - version=$(cat version)
        - git config --global user.email $username
        - git config --global user.name $token
        - git add .
        - git commit -m "Update Dolmods $version"
        - git push "https://$username:$token@gitgud.io/Frostberg/transmod-plus.git" HEAD:dolmods --force
    only:
        - master

build_upload_vanilla_job:
    stage: compilation
    script:
        - echo "Building DoTP v0.$CI_PIPELINE_IID"
        # - find . -type f -exec sed -i "s/DoTP_debug/DoTP_vanilla_debug/g" {} +
        - find ./version -type f -exec sed -i "s/DoTP version/DoTP v0.$CI_PIPELINE_IID/g" {} +
        - find ./devTools/androidsdk/image/cordova/config.xml -type f -exec sed -i "s/DoTP version/DoTP v0.$CI_PIPELINE_IID/g" {} +
        - find ./devTools/apkbuilder/config.xml -type f -exec sed -i "s/DoTP version/DoTP v0.$CI_PIPELINE_IID/g" {} +
        - find ./game/01-config/sugarcubeConfig.js -type f -exec sed -i "s/DoTP version/DoTP v0.$CI_PIPELINE_IID/g" {} +
        - version=$(cat version)
        - mkdir -p DoTP_Vanilla/img/
        - sh ./compile.sh
        - cp "Degrees of Lewdity.html" ./DoTP_Vanilla/
        - cp -r -f ./vanillaimg/* ./DoTP_Vanilla/img/
        # - sh ./devTools/apkbuilder/setup_deps.sh
        # - sh ./devTools/apkbuilder/build_app_debug.sh
        # - cp ./dist/Degrees-of-Transmod-Plus-$version-debug.apk ./
        - echo "Finished Building DoTP v0.$CI_PIPELINE_IID"
        - echo "Uploading DoTP v0.$CI_PIPELINE_IID"
        - zip -r ./DoTP_Vanilla_v0.$CI_PIPELINE_IID.zip ./DoTP_Vanilla/ 1>NUL
        - 'curl 
            --header "JOB-TOKEN: $CI_JOB_TOKEN"
            --upload-file ./DoTP_Vanilla_v0.$CI_PIPELINE_IID.zip
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoTP_Vanilla_v0.$CI_PIPELINE_IID.zip"'
        # - 'curl 
        #     --header "JOB-TOKEN: $CI_JOB_TOKEN"
        #     --upload-file ./Degrees-of-Transmod-Plus-$version-debug.apk
        #     "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoTP_Vanilla_v0.$CI_PIPELINE_IID.apk"'
        - echo "Finished Uploading DoTP v0.$CI_PIPELINE_IID"
    only:
        - master
        
