stages:
    - compilation
    - upload

variables:
    GIT_STRATEGY: fetch
    # Required GitLab CI/CD variables for R2 uploads:
    # R2_ACCOUNT_ID, R2_BUCKET, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
    # Required for release links: R2_PUBLIC_URL, without a trailing slash.

default:
    retry: 2

before_script:
    - apk add --no-cache zip jq nodejs git aws-cli
    - |
        upload_r2_zip() {
            package_name="$1"
            folder="$2"
            version="v0.$CI_PIPELINE_IID"
            zip_name="${package_name}_${version}.zip"
            object_key="${package_name}/${version}/${zip_name}"
            endpoint_url="${R2_ENDPOINT_URL:-https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com}"

            : "${R2_ACCOUNT_ID:?Set R2_ACCOUNT_ID in GitLab CI/CD variables}"
            : "${R2_BUCKET:?Set R2_BUCKET in GitLab CI/CD variables}"
            : "${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in GitLab CI/CD variables}"
            : "${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in GitLab CI/CD variables}"

            rm -f "./${zip_name}"
            zip -r "./${zip_name}" "./${folder}/" >/dev/null

            aws s3 cp "./${zip_name}" "s3://${R2_BUCKET}/${object_key}" \
                --endpoint-url "$endpoint_url" \
                --region auto \
                --content-type "application/zip" \
                --cache-control "public, max-age=31536000, immutable" \
                --no-progress
        }

dolmods_update:
    stage: compilation
    script:
        - find ./version -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - find ./devTools/apkbuilder/config.xml -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - find ./game/01-config/sugarcubeConfig.js -type f -exec sed -i "s/DoLP version/DoLP v0.$CI_PIPELINE_IID/g" {} +
        - version=$(cat version)
        - git config --global user.email $username
        - git config --global user.name $username
        - git add .
        - git commit -m "Update Dolmods $version"
        - git push "https://$username:$token@gitgud.io/Frostberg/degrees-of-lewdity-plus.git" HEAD:dolmods --force
    only:
        - master

