stages:
    - auto-release

variables:
    VERSION: ""

before_script:
    - export VERSION=$(cat version)
    - SANITIZED_VERSION=$(echo "$VERSION" | tr ' ' _)
    - apk add --no-cache zip
    - apk add --no-cache curl
    - apk add --no-cache jq
    - apk add --no-cache nodejs

build_job:
    stage: auto-release
    script:
    - echo "Building version v0.$CI_PIPELINE_IID"
    - mkdir -p releases/DoLP_Vanilla/img/
    - mkdir -p releases/DoLP_BEEESSS/img/
    - mkdir -p releases/DoLP_BEEESSS+Hikari_Female/img/
    - mkdir -p releases/DoLP_BEEESSS+Hikari_Male/img/
    - mkdir -p releases/DoLP_BEEESSS+Paril+Hairstyle_Extended/img/
    - mkdir -p releases/DoLP_Modloader/img/
    - sh ./compile.sh
    - node "dist-insertTools/insert2html.cjs" "Degrees of Lewdity.html" "modList.json" "dist-BeforeSC2/BeforeSC2.js"
    - cp "Degrees of Lewdity.html" ./releases/DoLP_Vanilla/
    - cp -r -f ./vanillaimg/* ./releases/DoLP_Vanilla/img/
    - cp "Degrees of Lewdity.html" ./releases/DoLP_BEEESSS/
    - cp -r -f ./beeesssimg/* ./releases/DoLP_BEEESSS/img/
    - cp "Degrees of Lewdity.html" ./releases/DoLP_BEEESSS+Hikari_Female/
    - cp -r -f ./beeessshikarifemaleimg/* ./releases/DoLP_BEEESSS+Hikari_Female/img/
    - cp "Degrees of Lewdity.html" ./releases/DoLP_BEEESSS+Hikari_Male/
    - cp -r -f ./beeessshikarimaleimg/* ./releases/DoLP_BEEESSS+Hikari_Male/img/
    - cp "Degrees of Lewdity.html" ./releases/DoLP_BEEESSS+Paril+Hairstyle_Extended/
    - cp -r -f ./beeesssparilhairstyleextendedimg/* ./releases/DoLP_BEEESSS+Paril+Hairstyle_Extended/img/
    - cp "Degrees of Lewdity.html.mod.html" ./releases/DoLP_Modloader/
    - cp -r -f ./vanillaimg/* ./releases/DoLP_Modloader/img/
    only:
        - master
    after_script:
        - echo "Finished building."

upload:
    stage: auto-release
    needs:
        - job: build_job
    variables:
        GIT_STRATEGY: none
    script:
        - echo "Uploading zips..."
        - cd ./releases/
        - zip -r ./DoLP_Vanilla/DoLP_Vanilla_v0.$CI_PIPELINE_IID.zip ./DoLP_Vanilla/ 1>NUL
        - 'curl 
            --header "JOB-TOKEN: $CI_JOB_TOKEN"
            --upload-file ./DoLP_Vanilla/DoLP_Vanilla_v0.$CI_PIPELINE_IID.zip
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_Vanilla_v0.$CI_PIPELINE_IID.zip"'
        - zip -r ./DoLP_BEEESSS/DoLP_BEEESSS_v0.$CI_PIPELINE_IID.zip ./DoLP_BEEESSS/ 1>NUL
        - 'curl 
            --header "JOB-TOKEN: $CI_JOB_TOKEN"
            --upload-file ./DoLP_BEEESSS/DoLP_BEEESSS_v0.$CI_PIPELINE_IID.zip
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS_v0.$CI_PIPELINE_IID.zip"'
        - zip -r ./DoLP_BEEESSS+Hikari_Female/DoLP_BEEESSS+Hikari_Female_v0.$CI_PIPELINE_IID.zip ./DoLP_BEEESSS+Hikari_Female/ 1>NUL
        - 'curl 
            --header "JOB-TOKEN: $CI_JOB_TOKEN"
            --upload-file ./DoLP_BEEESSS+Hikari_Female/DoLP_BEEESSS+Hikari_Female_v0.$CI_PIPELINE_IID.zip
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS+Hikari_Female_v0.$CI_PIPELINE_IID.zip"'
        - zip -r ./DoLP_BEEESSS+Hikari_Male/DoLP_BEEESSS+Hikari_Male_v0.$CI_PIPELINE_IID.zip ./DoLP_BEEESSS+Hikari_Male/ 1>NUL
        - 'curl 
            --header "JOB-TOKEN: $CI_JOB_TOKEN"
            --upload-file ./DoLP_BEEESSS+Hikari_Male/DoLP_BEEESSS+Hikari_Male_v0.$CI_PIPELINE_IID.zip
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS+Hikari_Male_v0.$CI_PIPELINE_IID.zip"'
        - zip -r ./DoLP_BEEESSS+Paril+Hairstyle_Extended/DoLP_BEEESSS+Paril+Hairstyle_Extended_v0.$CI_PIPELINE_IID.zip ./DoLP_BEEESSS+Paril+Hairstyle_Extended/ 1>NUL
        - 'curl 
            --header "JOB-TOKEN: $CI_JOB_TOKEN"
            --upload-file ./DoLP_BEEESSS+Paril+Hairstyle_Extended/DoLP_BEEESSS+Paril+Hairstyle_Extended_v0.$CI_PIPELINE_IID.zip
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS+Paril+Hairstyle_Extended_v0.$CI_PIPELINE_IID.zip"'
        - zip -r ./DoLP_Modloader/DoLP_Modloader_v0.$CI_PIPELINE_IID.zip ./DoLP_Modloader/ 1>NUL
        - 'curl 
            --header "JOB-TOKEN: $CI_JOB_TOKEN"
            --upload-file ./DoLP_Modloader/DoLP_Modloader_v0.$CI_PIPELINE_IID.zip
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_Modloader_v0.$CI_PIPELINE_IID.zip"'
    only:
        - master
    after_script:
        - echo "Finished uploading zips."

release_job:
    stage: auto-release
    image: registry.gitlab.com/gitlab-org/release-cli:latest
    needs:
        - job: build_job
        - job: upload
          artifacts: true
    rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    script:
        - echo "Creating releases..."
    release:
        description: 'null'
        tag_name: 'v0.$CI_PIPELINE_IID'
        ref: '$CI_COMMIT_SHA'
        assets:
            links:
                - name: 'DoLP_Vanilla'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_Vanilla_v0.$CI_PIPELINE_IID.zip"
                - name: 'DoLP_BEEESSS'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS_v0.$CI_PIPELINE_IID.zip"
                - name: 'DoLP_BEEESSS+Hikari_Female'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS+Hikari_Female_v0.$CI_PIPELINE_IID.zip"
                - name: 'DoLP_BEEESSS+Hikari_Male'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS+Hikari_Male_v0.$CI_PIPELINE_IID.zip"
                - name: 'DoLP_BEEESSS+Paril+Hairstyle_Extended'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_BEEESSS+Paril+Hairstyle_Extended_v0.$CI_PIPELINE_IID.zip"
                - name: 'DoLP_Modloader'
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Content/1.0.0/DoLP_Modloader_v0.$CI_PIPELINE_IID.zip"
    after_script:
        - echo "Finished creating releases."