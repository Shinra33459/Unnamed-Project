stages:
    - build

variables:
    VERSION: ""

before_script:
    - apk add --no-cache docker
    - export VERSION=$(cat version)
    - mkdir -p releases/DoLP_Vanilla/img/
    - mkdir -p releases/DoLP_BEEESSS/img/
    - mkdir -p releases/DoLP_BEEESSS+Hikari_Female/img/
    - mkdir -p releases/DoLP_BEEESSS+Hikari_Male/img/
    - mkdir -p releases/DoLP_BEEESSS+Paril+Hairstyle_Extended/img/

build:
    stage: build
    script:
    - echo "Building version $VERSION"
    - docker exec -i gitlab-android-runner sh
    - chmod +x compile.sh
    - ./compile.sh
    - cp -r "Degrees of Lewdity VERSION.html" /releases/DoLP_Vanilla
    - cp -r /vanillaimg/* /releases/DoLP_Vanilla/img/
    - cp -r /vanillaimg/* /releases/DoLP_BEEESSS/img/
    - cp -r /vanillaimg/* /releases/DoLP_BEEESSS+Hikari_Female/img/
    - cp -r /vanillaimg/* /releases/DoLP_BEEESSS+Hikari_Male/img/
    - cp -r /vanillaimg/* /releases/DoLP_BEEESSS+Paril+Hairstyle_Extended/img/
    - cp -r "Degrees of Lewdity VERSION.html" /releases/DoLP_BEEESSS
    - cp -r /beeesssimg/* /releases/DoLP_BEEESSS/img/
    - cp -r /beeesssimg/* /releases/DoLP_BEEESSS+Hikari_Female/img/
    - cp -r /beeesssimg/* /releases/DoLP_BEEESSS+Hikari_Male/img/
    - cp -r /beeesssimg/* /releases/DoLP_BEEESSS+Paril+Hairstyle_Extended/img/
    - cp -r "Degrees of Lewdity VERSION.html" /releases/DoLP_BEEESSS+Hikari_Female
    - cp -r /beeessshikarifemaleimg/* /releases/DoLP_BEEESSS+Hikari_Female/img/
    - cp -r "Degrees of Lewdity VERSION.html" /releases/DoLP_BEEESSS+Hikari_Male
    - cp -r /beeessshikarimaleimg/* /releases/DoLP_BEEESSS+Hikari_Male/img/
    - cp -r "Degrees of Lewdity VERSION.html" /releases/DoLP_BEEESSS+Paril+Hairstyle_Extended
    - cp -r /beeesssparilhairstyleextendedimg/* /releases/DoLP_BEEESSS+Paril+Hairstyle_Extended/img/
  
    artifacts:
        paths:
            - releases/

after_script:
    - echo "Finished building."

release:
    stage: build
    script:
        - echo "Creating release ZIP files..."
        - cd releases
        - zip -r "DoLP_Vanilla_${VERSION}.zip" ./DoLP_Vanilla
        - zip -r "DoLP_BEEESSS_${VERSION}.zip" ./DoLP_BEEESSS
        - zip -r "DoLP_BEEESSS+Hikari_Female_${VERSION}.zip" ./DoLP_BEEESSS+Hikari_Female
        - zip -r "DoLP_BEEESSS+Hikari_Male_${VERSION}.zip" ./DoLP_BEEESSS+Hikari_Male
        - zip -r "DoLP_BEEESSS+Paril+Hairstyle_Extended_${VERSION}.zip" ./DoLP_BEEESSS+Paril+Hairstyle_Extended
    artifacts:
        paths:
            - releases/*.zip
    only:
        - master

upload:
  stage: upload
  script:
    - echo "Uploading release..."
    - curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "releases/DoLP_Vanilla_${VERSION}.zip" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLP/DoLP_Vanilla_${VERSION}.zip"
    - curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "releases/DoLP_BEEESSS_${VERSION}.zip" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLP/DoLP_BEEESSS_${VERSION}.zip"
    - curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "releases/DoLP_BEEESSS+Hikari_Female_${VERSION}.zip" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLP/DoLP_BEEESSS+Hikari_Female_${VERSION}.zip"
    - curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "releases/DoLP_BEEESSS+Hikari_Male_${VERSION}.zip" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLP/DoLP_BEEESSS+Hikari_Male_${VERSION}.zip"
    - curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "releases/DoLP_BEEESSS+Paril+Hairstyle_Extended_${VERSION}.zip" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/DoLP/DoLP_BEEESSS+Paril+Hairstyle_Extended_${VERSION}.zip"
  only:
    - master
